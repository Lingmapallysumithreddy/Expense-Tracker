apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finflow-backend-hpa
  namespace: finflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finflow-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finflow-frontend-hpa
  namespace: finflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finflow-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
